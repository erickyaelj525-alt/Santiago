name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    name: Backend (pruebas + base de datos)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: apiario_digital
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      PORT: 4000
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ''
      DB_NAME: apiario_digital
      JWT_SECRET: secreto_para_ci_suficientemente_largo
      JWT_EXPIRES: 8h
      CLIENT_URL: http://localhost:5173

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias del backend
        working-directory: backend
        run: npm ci || npm install

      - name: Crear esquema de la base de datos
        working-directory: backend
        run: npm run db:setup

      - name: Cargar datos de demostración
        working-directory: backend
        run: npm run db:seed

      - name: Ejecutar pruebas
        working-directory: backend
        run: npm test

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias del frontend
        working-directory: frontend
        run: npm ci || npm install

      - name: Ejecutar pruebas del frontend
        working-directory: frontend
        run: npm test

      - name: Compilar para producción
        working-directory: frontend
        run: npm run build
